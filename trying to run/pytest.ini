[pytest]
# Look for tests in the tests/ directory
testpaths = tests

# Add src to the python path so imports work
pythonpath = . src

# Coverage settings
addopts = 
    --cov=src/app 
    --cov-report=term-missing 
    --cov-report=html:coverage/html 
    --cov-report=xml:coverage/coverage.xml
    --cov-fail-under=75
