# This workflow file implements the 5-stage CI/CD pipeline
# as required by the Software Engineering Project Rubric.

name: Python CI/CD Pipeline

# Triggers the workflow on pushes to main and all pull requests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # --- 1. BUILD Job ---
  # Installs dependencies and checks if the project builds.
  build:
    name: "1. Build"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
  # --- 2. LINT Job ---
  # Runs after 'build'. Checks code quality.
  # Quality Gate: Fails if pylint score < 7.5
  lint:
    name: "2. Lint (Quality Gate: 7.5/10)"
    runs-on: ubuntu-latest
    needs: build # Depends on the 'build' job
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies (including pylint)
      run: |
        pip install -r requirements.txt
        pip install pylint

    - name: Run Pylint
      run: |
        # Run pylint, tee output to a file, and check score
        # We use a custom script to parse the score and fail the job
        pylint src/app --rcfile=.pylintrc | tee pylint-report.txt
        
        # Generate JSON format report as well
        pylint src/app --rcfile=.pylintrc --output-format=json > pylint-report.json || true
        
        # Extract score
        SCORE=$(grep 'Your code has been rated at' pylint-report.txt | awk '{print $7}' | cut -d/ -f1)
        
        echo "Pylint Score: $SCORE"
        
        if [ -z "$SCORE" ]; then
          echo "Pylint failed to run or find score."
          exit 1
        fi
        
        # The 'fail-under=7.5' in pylintrc should make this fail automatically,
        # but this is a manual check just in case.
        if (( $(echo "$SCORE < 7.5" | bc -l) )); then
          echo "::error::Pylint score is below 7.5. Failing build."
          exit 1
        fi
        
    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: |
          pylint-report.txt
          pylint-report.json
        
  # --- 3. SECURITY Job ---
  # Runs after 'build'. Scans for vulnerabilities.
  # Quality Gate: Fails on high-severity issues
  security:
    name: "3. Security (Quality Gate: No High Issues)"
    runs-on: ubuntu-latest
    needs: build # Depends on the 'build' job
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies (including bandit)
      run: |
        pip install -r requirements.txt
        pip install bandit

    - name: Run Bandit Security Scan
      run: |
        # Run bandit, save report to file
        # -r src: recursive scan of src folder
        # -f json: format as JSON
        # -o bandit-report.json: output to file
        # -ll: Only show issues of severity level LOW or higher
        # Exit with error if any issues found
        bandit -r src -f json -o bandit-report.json -ll
        
        # Check if high or medium severity issues found
        if grep -q '"issue_severity": "HIGH"' bandit-report.json; then
          echo "::error::High severity security issues found!"
          exit 1
        fi
        if grep -q '"issue_severity": "MEDIUM"' bandit-report.json; then
          echo "::error::Medium severity security issues found!"
          exit 1
        fi
    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json
        
  # --- 4. TEST & COVERAGE Job ---
  # Runs after 'build'. Runs all tests and checks coverage.
  # Quality Gate: Fails if coverage < 75%
  test:
    name: "4. Test & Coverage (Quality Gate: 75%)"
    runs-on: ubuntu-latest
    needs: build # Depends on the 'build' job
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies (including pytest, pytest-cov)
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Run Tests and Generate Coverage
      run: |
        # Run pytest. The configuration is in pytest.ini
        # It will automatically generate reports and fail if coverage < 75%
        # Generate JUnit XML format for test results
        pytest --junitxml=test-results.xml
        
    - name: Generate Test Results Summary
      if: always()
      run: |
        # Create a JSON summary of test results
        python -c "
        import xml.etree.ElementTree as ET
        import json
        
        tree = ET.parse('test-results.xml')
        root = tree.getroot()
        
        summary = {
            'total_tests': int(root.attrib.get('tests', 0)),
            'passed': int(root.attrib.get('tests', 0)) - int(root.attrib.get('failures', 0)) - int(root.attrib.get('errors', 0)),
            'failed': int(root.attrib.get('failures', 0)),
            'errors': int(root.attrib.get('errors', 0)),
            'skipped': int(root.attrib.get('skipped', 0)),
            'time': float(root.attrib.get('time', 0))
        }
        
        with open('test-summary.json', 'w') as f:
            json.dump(summary, f, indent=2)
        
        print('Test Summary:')
        print(json.dumps(summary, indent=2))
        "
        
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test-results.xml
          test-summary.json
        
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage/html/
          coverage/coverage.xml
          
  # --- 5. CREATE ARTIFACT (Deployment) Job ---
  # Runs only if ALL previous jobs succeed.
  # Creates the .zip file deliverable.
  create-artifact:
    name: "5. Create Deployment Artifact"
    runs-on: ubuntu-latest
    # This job 'needs' all previous gates
    needs: [lint, security, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all CI Reports
      uses: actions/download-artifact@v4
      with:
        path: artifacts/ # Download all artifacts into this directory
        
    - name: Create Deployment Package
      run: |
        # Create a directory to hold the deployment files
        mkdir deployment
        
        # Copy source code
        cp -r src deployment/src
        
        # Copy essential files
        cp README.md deployment/
        cp requirements.txt deployment/
        
        # Copy all downloaded reports
        mkdir deployment/reports
        cp artifacts/lint-report/pylint-report.txt deployment/reports/ || true
        cp artifacts/lint-report/pylint-report.json deployment/reports/ || true
        cp artifacts/security-report/bandit-report.json deployment/reports/ || true
        cp -r artifacts/coverage-report/html deployment/reports/coverage-html || true
        cp artifacts/coverage-report/coverage.xml deployment/reports/ || true
        cp artifacts/test-results/test-results.xml deployment/reports/ || true
        cp artifacts/test-results/test-summary.json deployment/reports/ || true

        # Create a manifest file
        echo "Deployment Package Contents:" > deployment/MANIFEST.txt
        echo "============================" >> deployment/MANIFEST.txt
        echo "" >> deployment/MANIFEST.txt
        echo "1. Source Code: src/" >> deployment/MANIFEST.txt
        echo "2. Documentation: README.md" >> deployment/MANIFEST.txt
        echo "3. Dependencies: requirements.txt" >> deployment/MANIFEST.txt
        echo "" >> deployment/MANIFEST.txt
        echo "4. CI/CD Reports (reports/):" >> deployment/MANIFEST.txt
        echo "   - pylint-report.txt (Lint report - text format)" >> deployment/MANIFEST.txt
        echo "   - pylint-report.json (Lint report - JSON format)" >> deployment/MANIFEST.txt
        echo "   - bandit-report.json (Security scan report)" >> deployment/MANIFEST.txt
        echo "   - coverage-html/ (Coverage report - HTML)" >> deployment/MANIFEST.txt
        echo "   - coverage.xml (Coverage report - XML)" >> deployment/MANIFEST.txt
        echo "   - test-results.xml (Test results - JUnit XML)" >> deployment/MANIFEST.txt
        echo "   - test-summary.json (Test summary - JSON)" >> deployment/MANIFEST.txt
        echo "" >> deployment/MANIFEST.txt
        echo "Generated on: $(date)" >> deployment/MANIFEST.txt

        # Zip the deployment directory
        zip -r deployment.zip deployment
        
    - name: Upload Deployment Artifact
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: deployment.zip